name: Tahanan
options:
  bundleIdPrefix: com.raemulanlands
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: UZMK9VPGZ7
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: NO
targets:
  Tahanan:
    type: application
    platform: iOS
    sources:
      - path: Tahanan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raemulanlands.tahanan
        PRODUCT_NAME: Tahanan
        INFOPLIST_FILE: Tahanan/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
