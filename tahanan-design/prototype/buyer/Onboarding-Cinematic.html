<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding · Cinematic morph</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Manrope:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#050D1C}
*{box-sizing:border-box}
a{color:#FFC42E}a:hover{color:#FFD86E}
.ob{font-family:'Manrope',system-ui,sans-serif;color:#F3F6FC;-webkit-font-smoothing:antialiased}
.ob button{font:inherit;color:inherit;cursor:pointer}
.ff{font-family:'Outfit','Manrope',system-ui,sans-serif}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.mo{position:absolute;overflow:hidden;transition:left 1.25s cubic-bezier(.77,0,.175,1),top 1.25s cubic-bezier(.77,0,.175,1),width 1.25s cubic-bezier(.77,0,.175,1),height 1.25s cubic-bezier(.77,0,.175,1),border-radius 1.25s cubic-bezier(.77,0,.175,1),background-color .9s ease,box-shadow 1.25s ease,opacity .8s ease}
.ly{position:absolute;inset:0;transition:opacity .75s ease}
.blob{position:absolute;border-radius:999px;transition:left 1.9s cubic-bezier(.65,0,.35,1),top 1.9s cubic-bezier(.65,0,.35,1),width 1.9s cubic-bezier(.65,0,.35,1),height 1.9s cubic-bezier(.65,0,.35,1),opacity 1.6s ease}
.img{display:block;width:100%;height:100%;object-fit:cover}
.kb{animation:kb 14s ease-in-out infinite alternate}@keyframes kb{from{transform:scale(1.06)}to{transform:scale(1.24) translate(-2%,-2%)}}
.wm{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-right:.24em}
.wi{display:inline-block;animation:wiA 1.05s cubic-bezier(.16,1,.3,1) both}
@keyframes wiA{from{transform:translateY(115%) rotate(7deg);opacity:0;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
.eb{margin:0;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#FFC42E;animation:ebA 1.2s cubic-bezier(.2,.8,.2,1) .15s both}
@keyframes ebA{from{opacity:0;letter-spacing:.6em;filter:blur(4px)}to{opacity:1;letter-spacing:.16em;filter:none}}
.bd{animation:bdA 1s cubic-bezier(.2,.8,.2,1) .75s both}
@keyframes bdA{from{opacity:0;transform:translateY(14px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
.sweep{position:absolute;top:-10%;bottom:-10%;left:-60%;width:220%;pointer-events:none;background:linear-gradient(105deg,rgba(255,255,255,0) 42%,rgba(255,255,255,.09) 50%,rgba(255,196,46,.06) 53%,rgba(255,255,255,0) 61%);animation:swA 1.6s cubic-bezier(.6,0,.2,1) both;z-index:8}
@keyframes swA{from{transform:translateX(-45%)}to{transform:translateX(45%)}}
.spark{position:absolute;border-radius:9px;animation:spA linear infinite}
@keyframes spA{0%{transform:translateY(0);opacity:0}15%{opacity:.9}85%{opacity:.6}100%{transform:translateY(-140px);opacity:0}}
.scanline{position:absolute;left:12%;right:12%;height:3px;border-radius:9px;background:#FFC42E;box-shadow:0 0 22px 5px rgba(255,196,46,.65);animation:scA 2.4s ease-in-out infinite}
@keyframes scA{0%{top:14%}50%{top:84%}100%{top:14%}}
.stripes{background-image:repeating-linear-gradient(-45deg,rgba(11,26,51,.95) 0 6px,rgba(11,26,51,.7) 6px 12px)}
.grow{animation:grA 1.4s cubic-bezier(.65,0,.35,1) .9s both}@keyframes grA{from{width:0}to{width:62%}}
.seg{display:block;height:100%;background:#FFC42E;border-radius:9px;animation:sgA linear both}@keyframes sgA{from{width:0}to{width:100%}}
.ring{animation:rgA 2.2s ease-out infinite}@keyframes rgA{0%{transform:scale(.92);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.btnY{height:58px;border:0;border-radius:999px;background:#FFC42E;color:#0B1A33 !important;font-weight:800 !important;font-size:16px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 24px;width:100%;box-shadow:0 14px 34px -12px rgba(255,196,46,.6);transition:transform .15s ease}
.btnY:active,.press:active{transform:scale(.97)}
.btnY .chip{width:46px;height:46px;border-radius:999px;background:#0B1A33;color:#FFC42E;display:grid;place-items:center}
.btnG{height:54px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#F3F6FC;font-weight:700;font-size:15px;width:100%}
.mark-in{animation:bdA 1s cubic-bezier(.2,.8,.2,1) both}
.trk{animation:trA 1.6s cubic-bezier(.2,.8,.2,1) both}@keyframes trA{from{letter-spacing:1em;opacity:0}to{letter-spacing:.34em;opacity:1}}
</style>

<style>html,body{min-height:100%}body{display:grid;place-items:center;min-height:100vh;background:#030812 !important}#dc-root{width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #0d1526,0 40px 120px rgba(0,0,0,.7)}</style>

<div id="dc-root"></div>
<template id="dc-template">

<div class="ob" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #071226;">

<div class="blob" aria-hidden="true" style="left: {{bg.b1x}}; top: {{bg.b1y}}; width: {{bg.b1s}}; height: {{bg.b1s}}; background: radial-gradient(closest-side, rgba(46,107,230,.55), rgba(46,107,230,0));"></div>
<div class="blob" aria-hidden="true" style="left: {{bg.b2x}}; top: {{bg.b2y}}; width: {{bg.b2s}}; height: {{bg.b2s}}; opacity: {{bg.b2o}}; background: radial-gradient(closest-side, rgba(255,196,46,.32), rgba(255,196,46,0));"></div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 380px; background: linear-gradient(rgba(7,18,38,0), #071226 55%);"></div>
<sc-for list="{{sparks}}" as="p" hint-placeholder-count="10"><span class="spark" aria-hidden="true" style="left: {{p.x}}; top: {{p.y}}; width: {{p.s}}; height: {{p.s}}; background: {{p.c}}; animation-duration: {{p.d}}; animation-delay: {{p.dl}};"></span></sc-for>

<!-- ===== MORPHING ACTORS ===== -->
<div class="mo" style="left: {{A.extra.x}}; top: {{A.extra.y}}; width: {{A.extra.w}}; height: {{A.extra.h}}; border-radius: {{A.extra.r}}; background-color: {{A.extra.bg}}; box-shadow: {{A.extra.sh}}; z-index: {{A.extra.z}}; opacity: {{A.extra.op}}; transition-delay: {{A.extra.dl}};">
<div class="ly" style="opacity: {{Ly.st3.op}}; transition-delay: {{Ly.st3.d}}; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 16px;"><span style="font-size: 13px; font-weight: 800; white-space: nowrap;">Spouse ID</span><span style="height: 26px; padding: 0 10px; border-radius: 99px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 800; background: rgba(46,107,230,.26); color: #93B4FF;">Submitted</span></div>
</div>

<div class="mo" style="left: {{A.sun.x}}; top: {{A.sun.y}}; width: {{A.sun.w}}; height: {{A.sun.h}}; border-radius: {{A.sun.r}}; background-color: {{A.sun.bg}}; box-shadow: {{A.sun.sh}}; z-index: {{A.sun.z}}; opacity: {{A.sun.op}}; transition-delay: {{A.sun.dl}}; color: #0B1A33;">

<div class="ly" style="opacity: {{Ly.journey.op}}; transition-delay: {{Ly.journey.d}}; padding: 8px; display: flex; align-items: center; gap: 10px;">

<span style="flex: 1; height: 10px; border-radius: 999px; background: rgba(11,26,51,.18); overflow: hidden; display: block;"><sc-if value="{{t.s3}}"><span class="stripes grow" style="display: block; height: 100%; border-radius: 999px;"></span></sc-if></span>
<span style="width: 48px; height: 48px; border-radius: 999px; background: #0B1A33; color: #FFC42E; display: grid; place-items: center; flex: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span>
</div>
</div>

<div class="ly" style="opacity: {{Ly.st1.op}}; transition-delay: {{Ly.st1.d}}; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 16px;"><span style="font-size: 13px; font-weight: 800; white-space: nowrap;">Valid ID</span><span style="height: 26px; padding: 0 10px; border-radius: 99px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 800; background: rgba(47,169,107,.2); color: #62D69C;">Accepted</span></div>

var SH0 = '0 0 0 0 rgba(0,0,0,0), 0 0 0 0 rgba(0,0,0,0)';
var SHP = '0 40px 80px -24px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.16)';
var SHG = '0 22px 44px -18px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.13)';
var GLASS = 'rgba(16,33,64,.94)';
// mark geometry: box left L, top T, scale k (104 x 100 unit mark)
function mark(L, T, k, dl) {
  return {
    sun: act(L + 50 * k, T, 54 * k, 54 * k, px(27 * k), '#FFC42E', '0 0 60px 10px rgba(255,196,46,.45), 0 0 0 0 rgba(0,0,0,0)', 1, 1, dl[1]),
    roof: act(L, T + 18 * k, 70 * k, 82 * k, px(35 * k) + ' ' + px(35 * k) + ' ' + px(5 * k) + ' ' + px(5 * k), '#2E6BE6', SH0, 2, 1, dl[0]),
    door: act(L + 22 * k, T + 62 * k, 26 * k, 38 * k, px(13 * k) + ' ' + px(13 * k) + ' 0px 0px', '#F2622E', SH0, 3, 1, dl[2]),
    bush: act(L + 81 * k, T + 77 * k, 19 * k, 23 * k, px(9.5 * k) + ' ' + px(9.5 * k) + ' ' + px(3 * k) + ' ' + px(3 * k), '#2FA96B', SH0, 3, 1, dl[3]),
    extra: act(L + 40 * k, T + 70 * k, 20, 20, '10px', GLASS, SH0, 0, 0, '0s')
  };
}
var GEO = {
  boot: (function () {
    var k = 180 / 104, L = 105, T = 244, base = T + 100 * k;
    return {
      sun: act(L + 50 * k + 27 * k, base - 20, 0, 0, '0px', '#FFC42E', SH0, 1, 0, '0s'),
      roof: act(L, base, 70 * k, 0, px(35 * k) + ' ' + px(35 * k) + ' 0px 0px', '#2E6BE6', SH0, 2, 1, '0s'),
      door: act(L + 22 * k, base, 26 * k, 0, '0px', '#F2622E', SH0, 3, 1, '0s'),
      bush: act(L + 81 * k + 9 * k, base, 0, 0, '0px', '#2FA96B', SH0, 3, 1, '0s'),
      extra: act(180, 360, 20, 20, '10px', GLASS, SH0, 0, 0, '0s')
    };
  })(),
  intro: mark(105, 244, 180 / 104, ['.15s', '.75s', '1.05s', '1.3s']),
  discover: {
    roof: act(100, 150, 190, 312, '95px 95px 24px 24px', '#0F2142', SHP, 3, 1, '0s'),
    sun: act(214, 104, 150, 150, '75px', '#FFC42E', '0 0 110px 28px rgba(255,196,46,.42), 0 0 0 0 rgba(0,0,0,0)', 1, 1, '.1s'),
    door: act(18, 296, 124, 196, '62px 62px 18px 18px', '#0F2142', SHP, 2, 1, '.18s'),
    bush: act(250, 286, 122, 192, '61px 61px 18px 18px', '#0F2142', SHP, 2, 1, '.26s'),
    extra: act(180, 360, 20, 20, '10px', GLASS, SH0, 0, 0, '0s')
  },
  scan: {
    roof: act(65, 140, 260, 310, '36px 36px 36px 36px', '#0B1A33', SHP, 2, 1, '0s'),
    sun: act(22, 118, 172, 60, '18px', '#FFC42E', '0 22px 44px -14px rgba(255,196,46,.6), 0 0 0 0 rgba(0,0,0,0)', 4, 1, '.12s'),
    door: act(146, 420, 224, 66, '20px 20px 20px 20px', GLASS, SHG, 3, 1, '.2s'),
    bush: act(158, 431, 44, 44, '22px 22px 22px 22px', '#2FA96B', '0 0 0 6px rgba(47,169,107,.22), 0 0 0 0 rgba(0,0,0,0)', 5, 1, '.32s'),
    extra: act(180, 360, 20, 20, '10px', GLASS, SH0, 0, 0, '0s')
  },
  track: {
    roof: act(150, 138, 212, 292, '106px 106px 24px 24px', '#0F2142', SHP, 1, 1, '0s'),
    sun: act(20, 452, 350, 64, '32px', '#FFC42E', '0 18px 40px -16px rgba(255,196,46,.6), 0 0 0 0 rgba(0,0,0,0)', 4, 1, '.3s'),
    door: act(20, 186, 214, 54, '18px 18px 18px 18px', GLASS, SHG, 3, 1, '.08s'),
    bush: act(36, 256, 214, 54, '18px 18px 18px 18px', GLASS, SHG, 3, 1, '.16s'),
    extra: act(20, 326, 214, 54, '18px', GLASS, SHG, 3, 1, '.24s')
  },
  ready: mark(120, 196, 150 / 104, ['.25s', '.15s', '.08s', '0s'])
};
var LAYERS = {
  intro: ['face'], boot: ['face'], ready: ['face'],
  discover: ['ph', 'pp', 'pv'],
  scan: ['row', 'scan', 'chip', 'book', 'check'],
  track: ['hts', 'journey', 'st1', 'st2', 'st3']
};
var ALL = ['face', 'ph', 'row', 'hts', 'scan', 'chip', 'journey', 'pp', 'book', 'st1', 'pv', 'check', 'st2', 'st3'];
var TITLES = {
  discover: ['Every', 'family’s', 'home', 'begins', 'here.'],
  scan: ['Scan', 'once.', 'Book', 'in', 'minutes.'],
  track: ['Watch', 'every', 'step', 'home.'],
  ready: ['Your', 'tahanan', 'is', 'waiting.']
};
var ACCENT = { discover: 'home', scan: 'minutes.', track: 'home.', ready: 'tahanan' };
var BG = {
  boot: { b1x: '-40px', b1y: '520px', b1s: '470px', b2x: '120px', b2y: '300px', b2s: '160px', b2o: '0' },
  intro: { b1x: '-80px', b1y: '380px', b1s: '560px', b2x: '110px', b2y: '160px', b2s: '320px', b2o: '1' },
  discover: { b1x: '-120px', b1y: '160px', b1s: '520px', b2x: '150px', b2y: '20px', b2s: '320px', b2o: '1' },
  scan: { b1x: '20px', b1y: '80px', b1s: '420px', b2x: '-120px', b2y: '20px', b2s: '300px', b2o: '.7' },
  track: { b1x: '120px', b1y: '40px', b1s: '420px', b2x: '-80px', b2y: '330px', b2s: '360px', b2o: '.9' },
  ready: { b1x: '-80px', b1y: '320px', b1s: '560px', b2x: '110px', b2y: '110px', b2s: '320px', b2o: '1' }
};
var SPARKS = [[40, 520, 4], [92, 300, 3], [150, 610, 5], [210, 250, 3], [262, 560, 4], [320, 340, 5], [350, 620, 3], [70, 690, 3], [300, 180, 4], [180, 700, 4]].map(function (s, i) {
  return { x: s[0] + 'px', y: s[1] + 'px', s: s[2] + 'px', c: i % 3 === 0 ? 'rgba(255,255,255,.7)' : '#FFC42E', d: (7 + (i % 4) * 2) + 's', dl: (-i * 1.3) + 's' };
});

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.timer = null;
    var start = SCENES.indexOf(props.scene || 'intro');
    this.state = { i: start < 0 ? 0 : start, booted: start > 0, cycle: 0 };
  }
  componentDidMount() {
    if (!this.state.booted) { this.bootT = setTimeout(() => { this.setState({ booted: true }, () => this.arm()); }, 160); }
    else this.arm();
  }
  componentWillUnmount() { clearTimeout(this.timer); clearTimeout(this.bootT); }
  componentDidUpdate(prev) {
    if (prev.scene !== this.props.scene) { var s = SCENES.indexOf(this.props.scene || 'intro'); this.goTo(s < 0 ? 0 : s); }
    if (prev.autoplay !== this.props.autoplay) this.arm();
  }
  autoplay() { return this.props.autoplay !== false; }
  arm() {
    clearTimeout(this.timer);
    var d = DUR[this.state.i];
    if (this.autoplay() && d) this.timer = setTimeout(() => this.goTo(this.state.i + 1), d);
  }
  goTo(i) {
    var n = Math.max(0, Math.min(SCENES.length - 1, i));
    this.setState({ i: n, booted: true }, () => this.arm());
  }
  renderVals() {
    var self = this, s = this.state;
    var name = s.booted ? SCENES[s.i] : 'boot';
    var g = GEO[name];
    var on = LAYERS[name] || [];
    var Ly = {};
    ALL.forEach(function (k) { var v = on.indexOf(k) >= 0; Ly[k] = { op: v ? '1' : '0', d: v ? '.5s' : '0s' }; });
    var w = {};
    Object.keys(TITLES).forEach(function (k) {
      w['s' + SCENES.indexOf(k)] = TITLES[k].map(function (t, j) { return { t: t, d: (0.38 + j * 0.075).toFixed(3) + 's', c: t === ACCENT[k] ? '#FFC42E' : '#F3F6FC' }; });
    });
    if (w.s4) w.s4 = w.s4.map(function (x, j) { return Object.assign({}, x, { d: (1.3 + j * 0.08).toFixed(3) + 's' }); });
    var t = { s0: s.booted && s.i === 0, s1: s.i === 1, s2: s.i === 2, s3: s.i === 3, s4: s.i === 4 };
    var segs = SCENES.slice(0, 4).map(function (x, j) {
      var auto = self.autoplay();
      return { done: j < s.i, run: j === s.i && auto, hold: j === s.i && !auto, dur: (DUR[j] / 1000) + 's' };
    });
    return {
      A: g, Ly: Ly, bg: BG[name], sparks: SPARKS, t: t, w: w, segs: segs,
      top: { logoOp: s.i === 0 || s.i === 4 ? '0' : '1', skip: s.i < 4, replay: s.i === 4 },
      ctrl: { on: s.i < 4 },
      next: function () { self.goTo(s.i + 1); },
      skip: function () { self.goTo(4); },
      replay: function () { clearTimeout(self.timer); self.setState({ i: 0, booted: false }, function () { self.bootT = setTimeout(function () { self.setState({ booted: true }, function () { self.arm(); }); }, 160); }); },
      done: function () {}
    };
  }
}

window.Component = Component; mountDC();
</script>
